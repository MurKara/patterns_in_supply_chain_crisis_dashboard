name: Deploy static content to Pages
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (site contents)
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: docs/**        # upload the contents of docs directory
          root_directory: docs # ensure artifact root is the docs contents

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        with:
          artifact: github-pages
